name: Repository Researcher Tests

on:
  push:
    branches:
      - integration/gamedev-agent-skills
  pull_request:
    branches:
      - integration/gamedev-agent-skills
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Node.js tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
